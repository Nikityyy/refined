[package]
name = "refined"
version = "0.3.0"
edition = "2021"
description = "AI text refiner for Windows: select text anywhere, press Alt+V, get polished text back in place."
license = "MIT"

[features]
# Demo / capture / benchmark scaffolding. Enabled only for development
# builds (screenshots, benches); never in the shipped binaries.
demo = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
ureq = { version = "3", default-features = false, features = ["json", "native-tls-no-default"] }
sha2 = "0.10"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
]

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
