[package]
name = "refined"
version = "0.1.0"
edition = "2021"
description = "Adobe Spectrum 2 AI text refiner for Windows."
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
epaint_default_fonts = { version = "0.37", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", default-features = false, features = ["json", "platform-verifier"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
