name: Release

# Pushing a tag such as v0.4.0 builds Windows and Linux on their own runners
# and publishes the release. The annotated tag message becomes the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked
      - run: choco install innosetup --no-progress -y
      - run: powershell -File .\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/installer/*

  linux:
    # The oldest supported Ubuntu keeps the glibc requirement low.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: |
          mkdir dist
          cp target/release/refined dist/refined-linux-x86_64
          cd dist && sha256sum refined-linux-x86_64 > refined-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" assets/* --title "Refined ${TAG#v}" --notes-from-tag
